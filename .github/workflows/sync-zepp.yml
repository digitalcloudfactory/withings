name: Zepp Sync Workflow

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-external-cron]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch, Summarize, and Sync Health Data to Stride
        env:
          STRIDE_TOKEN: ${{ secrets.STRIDE_TOKEN }}
        run: |
          # 1. Fetch band-data for Sleep Breakdown
          python sync-zepp.py --config zepp-config.json band-data --days 2 --json > band_data.json

          # 2. Fetch Readiness data
          python sync-zepp.py --config zepp-config.json events --preset readiness --days 2 --json > readiness_data.json

          # 3. Fetch Body Battery / Charge data for Raw Total
          python sync-zepp.py --config zepp-config.json events --preset body-battery --days 2 --json > hybrid_data.json

          # 4. Fetch Detailed HRV RMSSD sample points
          python sync-zepp.py --config zepp-config.json events --preset hrv-rmssd --days 2 --json > hrv_data.json

          # 5. Run Report and POST to Stride API
          python process_metrics.py
