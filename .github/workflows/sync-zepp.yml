name: Zepp Sync Workflow # (Added a top-level name for clarity)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-external-cron]

permissions:
  contents: write # 👈 Crucial: allows the script to commit the state file back to the repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and Summarize Sleep Data
        run: |
                python sync-zepp.py --config zepp-config.json manual-data --type sleep --json | python3 -c '
                import sys, json
                try:
                    data = json.load(sys.stdin)
                    items = data if isinstance(data, list) else data.get("data", [])
                    if items:
                        l = items[-1]
                        print(f"🌙 Sleep Score: {l.get(\"score\", \"N/A\")} | Total: {l.get(\"total_sleep_time\", 0)}m (Deep: {l.get(\"deep_sleep_time\", 0)}m, REM: {l.get(\"rem_sleep_time\", 0)}m)")
                    else:
                        print("No sleep items found.")
                except Exception as e:
                    print(f"Could not parse sleep output: {e}")
                '
