name: Sync Zepp Health Data

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-external-cron]

permissions:
  contents: write # 👈 Crucial: allows the script to commit the state file back to the repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Zepp Sync Script
        run: python sync-zepp.py --config zepp-config.json events --preset hrv-rmssd
        run: python sync-zepp.py --config zepp-config.json manual-data --type sleep
