name: Zepp Sync Workflow # (Added a top-level name for clarity)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-external-cron]

permissions:
  contents: write # 👈 Crucial: allows the script to commit the state file back to the repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch HybridCharge Data
        run: |
          python sync-zepp.py events --type Charge --subtype insight_data --days 7
          
          python sync-zepp.py --config zepp-config.json events --preset body-battery --days 2 --json > hybrid_data.json
          
          # Write the python script to a file to avoid inline shell/whitespace errors
          cat << 'EOF' > parse_hybrid.py
          import json, datetime, urllib.request, urllib.error

          STRIDE_TOKEN = "stride_pat_vRgxR3OuyXCsIqIjdO9PgmHILhHyOYLDiP12dqZfqgg"
          STRIDE_URL = "https://api.stride.is/v1/athletes/me/metrics"
          now_iso = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          def post_to_stride(metric_type, value):
              if value is None or value == "N/A":
                  return
              val = int(value)
              payload = {"type": metric_type, "value": val, "timestamp": now_iso}
              data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  STRIDE_URL, data=data, 
                  headers={"Authorization": f"Bearer {STRIDE_TOKEN}", "Content-Type": "application/json"}, 
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      print(f"  [Stride API] Successfully posted {metric_type} = {val} (HTTP {resp.status})")
              except urllib.error.HTTPError as err:
                  print(f"  [Stride API] Failed to post {metric_type} (HTTP {err.code}): {err.read().decode()}")

          try:
              with open("hybrid_data.json") as f:
                  raw_hybrid = json.load(f)
              items = raw_hybrid.get("items", []) if isinstance(raw_hybrid, dict) else []
              if items:
                  samples = items[0].get("value", {}).get("samples", [])
                  if samples:
                      wakeup_sample = max(samples, key=lambda x: x.get("total", 0))
                      hybrid_total = wakeup_sample.get("total", "N/A")
                      physical = wakeup_sample.get("physical", "N/A")
                      mental = wakeup_sample.get("mental", "N/A")
                      
                      print(f"Morning Body Battery : {hybrid_total}")
                      print(f"  - Physical Score   : {physical:.1f}")
                      print(f"  - Mental Score     : {mental:.1f}")
                      
                      if hybrid_total != "N/A":
                          post_to_stride("BODY_BATTERY", hybrid_total)
          except Exception as e:
              print(f"HybridCharge parsing error: {e}")
          EOF

          python3 parse_hybrid.py
