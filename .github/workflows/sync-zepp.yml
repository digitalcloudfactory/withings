name: Zepp Sync Workflow # (Added a top-level name for clarity)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-external-cron]

permissions:
  contents: write # 👈 Crucial: allows the script to commit the state file back to the repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch HybridCharge Data
        run: |
          python sync-zepp.py --config zepp-config.json events --preset body-battery --days 2 --json > hybrid_data.json
          python3 -c '
          import json
          try:
              with open("hybrid_data.json") as f:
                  data = json.load(f)
              items = data.get("items", []) if isinstance(data, dict) else []
              if items:
                  print("=== HYBRIDCHARGE / BODY BATTERY ITEM ===")
                  print(json.dumps(items[0], indent=2))
              else:
                  print("No hybrid charge records found.")
          except Exception as e:
              print(f"Error: {e}")
          '
