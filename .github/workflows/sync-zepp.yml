name: Zepp Sync Workflow # (Added a top-level name for clarity)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-external-cron]

permissions:
  contents: write # 👈 Crucial: allows the script to commit the state file back to the repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt


      - name: Inspect Daily Health Preset
        run: |
          python sync-zepp.py --config zepp-config.json events --preset daily-health --days 2 --json | python3 -c '
          import sys, json
          try:
              data = json.load(sys.stdin)
              items = data.get("items", []) if isinstance(data, dict) else (data if isinstance(data, list) else [])
              if items:
                  print("=== DAILY HEALTH ITEM KEYS ===")
                  print(list(items[0].keys()))
                  print("\n=== SAMPLE DAILY HEALTH ITEM ===")
                  print(json.dumps(items[0], indent=2))
              else:
                  print("No daily-health event records found.")
          except Exception as e:
              print(f"Daily health check failed: {e}")
          '
