name: Zepp Sync Workflow # (Added a top-level name for clarity)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-external-cron]

permissions:
  contents: write # 👈 Crucial: allows the script to commit the state file back to the repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug Band Data Structure
        run: |
          python sync-zepp.py --config zepp-config.json band-data --days 2 --json | python3 -c '
          import sys, json
          try:
              data = json.load(sys.stdin)
              print("Top-level type:", type(data).__name__)
              if isinstance(data, dict):
                  print("Top keys:", list(data.keys()))
                  data = data.get("data", data.get("items", [data]))
              
              if isinstance(data, list) and data:
                  print(f"Sample item keys: {list(data[0].keys())}")
                  print("Sample item snippet:", json.dumps(data[0])[:300])
          except Exception as e:
              print(f"Debug failed: {e}")
          '
