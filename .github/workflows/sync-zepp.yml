name: Zepp Sync Workflow # (Added a top-level name for clarity)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-external-cron]

permissions:
  contents: write # 👈 Crucial: allows the script to commit the state file back to the repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt


      - name: Extract and Sync Last 5 Days Raw Total Vitality Metrics to Stride
        run: |
          # 1. Fetch 7 days of Body Battery / Charge data
          python sync-zepp.py --config zepp-config.json events --preset body-battery --days 7 --json > multi_day_hybrid.json

          # 2. Python helper to extract, filter sentinels, and post to Stride API
          python3 -c '
          import json, datetime, urllib.request, urllib.error

          STRIDE_TOKEN = "stride_pat_vRgxR3OuyXCsIqIjdO9PgmHILhHyOYLDiP12dqZfqgg"
          STRIDE_URL = "https://api.stride.is/v1/athletes/me/metrics"

          try:
              with open("multi_day_hybrid.json") as f:
                  raw_data = json.load(f)
              items = raw_data.get("items", []) if isinstance(raw_data, dict) else []
              
              # Sort items by timestamp ascending and take the last 5 days
              items = sorted(items, key=lambda x: x.get("timestamp", 0))[-5:]
              
              print("==========================================")
              print("📊 SYNCING 5-DAY RAW TOTAL VITALITY TO STRIDE")
              print("==========================================")

              if not items:
                  print("No body-battery event records found.")

              for item in items:
                  ts_ms = item.get("timestamp")
                  if not ts_ms:
                      continue
                  
                  dt_utc = datetime.datetime.fromtimestamp(ts_ms / 1000.0, datetime.timezone.utc)
                  timestamp_iso = dt_utc.strftime("%Y-%m-%dT%H:%M:%SZ")
                  date_str = dt_utc.strftime("%Y-%m-%d")

                  samples = item.get("value", {}).get("samples", [])
                  if not samples:
                      print(f"📅 Date       : {date_str} | No sample points available.")
                      continue

                  # Filter out invalid/sentinel samples (total == 255 or missing total)
                  valid_samples = [s for s in samples if s.get("total") and s.get("total") != 255]
                  
                  if not valid_samples:
                      print(f"📅 Date       : {date_str}")
                      print(f"  └─ Status   : Skipped (All samples contained sentinel value 255)")
                      print("-" * 42)
                      continue

                  # Find the peak morning sample from valid data points
                  peak_sample = max(valid_samples, key=lambda x: x.get("total", 0))
                  raw_total = int(peak_sample.get("total", 0))

                  print(f"📅 Date       : {date_str}")
                  print(f"  └─ Raw Total : {raw_total}")

                  # POST to Stride API
                  payload = {
                      "type": "RECOVERY_SCORE",
                      "value": raw_total,
                      "timestamp": timestamp_iso
                  }
                  data = json.dumps(payload).encode("utf-8")
                  req = urllib.request.Request(
                      STRIDE_URL, data=data, 
                      headers={"Authorization": f"Bearer {STRIDE_TOKEN}", "Content-Type": "application/json"}, 
                      method="POST"
                  )
                  try:
                      with urllib.request.urlopen(req) as resp:
                          print(f"  [Stride API] Success for {date_str} (HTTP {resp.status})")
                  except urllib.error.HTTPError as err:
                      print(f"  [Stride API] Failed for {date_str} (HTTP {err.code}): {err.read().decode()}")

                  print("-" * 42)

              print("==========================================")
          except Exception as e:
              print(f"Sync script error: {e}")
          '
