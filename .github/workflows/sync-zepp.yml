name: Zepp Sync Workflow # (Added a top-level name for clarity)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-external-cron]

permissions:
  contents: write # 👈 Crucial: allows the script to commit the state file back to the repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt


      - name: Inspect All Readiness Sub-Scores
        run: |
          python sync-zepp.py --config zepp-config.json events --preset readiness --days 2 --json | python3 -c '
          import sys, json
          data = json.load(sys.stdin)
          items = data.get("items", []) if isinstance(data, dict) else data
          if items:
              for idx, item in enumerate(items):
                  print(f"--- Readiness Record {idx} ---")
                  val = item.get("value", {})
                  for k, v in val.items():
                      if "Score" in k or "score" in k or v == 84:
                          print(f"  {k}: {v}")
          '
