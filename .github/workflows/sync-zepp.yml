name: Zepp Sync Workflow # (Added a top-level name for clarity)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-external-cron]

permissions:
  contents: write # 👈 Crucial: allows the script to commit the state file back to the repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and Summarize Sleep Data
        run: |
          python sync-zepp.py --config zepp-config.json band-data --days 2 --json | python3 -c '
          import sys, json, base64
          try:
              raw = json.load(sys.stdin)
              items = raw.get("data", []) if isinstance(raw, dict) else raw
              if items:
                  print(f"Found {len(items)} band-data records.")
                  for item in items:
                      print(f"Record date: {item.get(\"date_time\")} | data_type: {item.get(\"data_type\")}")
                      # If summary is base64 encoded JSON string, try decoding it
                      summary_str = item.get("summary")
                      if summary_str and isinstance(summary_str, str):
                          try:
                              # Attempt base64 decode if applicable
                              decoded = base64.b64decode(summary_str).decode("utf-8")
                              summary_data = json.loads(decoded)
                              print("  Decoded summary keys:", list(summary_data.keys()))
                          except Exception:
                              pass
              else:
                  print("No band data records found.")
          except Exception as e:
              print(f"Parsing failed: {e}")
          '
