name: Zepp Sync Workflow # (Added a top-level name for clarity)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-external-cron]

permissions:
  contents: write # 👈 Crucial: allows the script to commit the state file back to the repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch HybridCharge Data
        run: |
          python sync-zepp.py --config zepp-config.json events --preset body-battery --days 2 --json > hybrid_data.json
          python3 -c '
          import json
          
          # --- HYBRIDCHARGE / BODY BATTERY METRICS (WAKE-UP / MORNING) ---
          try:
              with open("hybrid_data.json") as f:
                  raw_hybrid = json.load(f)
              items = raw_hybrid.get("items", []) if isinstance(raw_hybrid, dict) else []
              if items:
                  samples = items[0].get("value", {}).get("samples", [])
                  if samples:
                      # Option A: The very first recorded sample of the morning (waking up)
                      # wakeup_sample = samples[0]
                      
                      # Option B: Find the peak/maximum charge reached during the morning block
                      wakeup_sample = max(samples, key=lambda x: x.get("total", 0))
                      
                      hybrid_total = wakeup_sample.get("total", "N/A")
                      physical = wakeup_sample.get("physical", "N/A")
                      mental = wakeup_sample.get("mental", "N/A")
                      offset_mins = wakeup_sample.get("s", 0) // 60
                      
                      print(f"⚡ Morning Body Battery : {hybrid_total} (at +{offset_mins} mins)")
                      print(f"  ├─ Physical Score     : {physical:.1f}")
                      print(f"  └─ Mental Score       : {mental:.1f}")
                      
                      if hybrid_total != "N/A":
                          post_to_stride("BODY_BATTERY", hybrid_total)
          except Exception as e:
              print(f"HybridCharge parsing error: {e}")
