name: Zepp Sync Workflow # (Added a top-level name for clarity)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-external-cron]

permissions:
  contents: write # 👈 Crucial: allows the script to commit the state file back to the repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Extract and Inspect Sleep Data
        run: |
          python sync-zepp.py --config zepp-config.json band-data --days 2 --json | python3 -c '
          import sys, json, base64
          try:
              raw = json.load(sys.stdin)
              items = raw.get("data", []) if isinstance(raw, dict) else raw
              if items:
                  # Grab the latest record
                  latest = items[-1]
                  dt = latest.get("date_time")
                  print(f"Latest record date: {dt}")
                  
                  summary_str = latest.get("summary")
                  if summary_str:
                      decoded = base64.b64decode(summary_str).decode("utf-8")
                      summary_data = json.loads(decoded)
                      slp = summary_data.get("slp")
                      
                      print("=== SLEEP OBJECT (slp) ===")
                      print(json.dumps(slp, indent=2))
              else:
                  print("No band data records found.")
          except Exception as e:
              print(f"Extraction failed: {e}")
          '
