name: Sync Withings Health Data

on:
  schedule:
    - cron: '50 4 * * *' # Runs daily at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write # 👈 Crucial: allows the script to commit the state file back to the repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Withings Sync Script
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          TARGET_API_URL: ${{ secrets.TARGET_API_URL }} # Now we use this!
          STRIDE_TOKEN: ${{ secrets.STRIDE_TOKEN }}
        run: python sync.py

      - name: Commit and push if state changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_measurement.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "chore: update last processed measurement" && git push)
